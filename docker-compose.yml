# Production stack, deployed with Coolify (its proxy handles domains and HTTPS).
# Domains are set per service in the Coolify UI: web on port 3000, bot on port 3001 under /ws.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tribunal
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: tribunal
    volumes:
      - postgres-data:/var/lib/postgresql/data

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      POSTGRESQL_URL: postgres://tribunal:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/tribunal
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-1095123126746099834}
      DISCORD_AGENTS_CATEGORY_ID: ${DISCORD_AGENTS_CATEGORY_ID:-1574094410830844105}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
      DISCORD_VOICE_CATEGORY_ID: ${DISCORD_VOICE_CATEGORY_ID:-1572558769139752960}
      PIPER_URL: http://tts:5000
      PIPER_SPEAKER: ${PIPER_SPEAKER-8582}
      WHISPER_URL: http://stt:8080
      EXA_API_KEY: ${EXA_API_KEY:-}
      ROOM_PORT: "3001"
      WEB_INTERNAL_URL: http://web:3000
      WEB_PUBLIC_URL: https://tribunal.gaetanhus.fr
    depends_on:
      - postgres

  # Self-hosted voice of the judge (Piper), reached by the bot only:
  tts:
    build:
      context: .
      dockerfile: docker/piper.Dockerfile
      args:
        PIPER_VOICE: ${PIPER_VOICE:-fr_FR-mls-medium}
    restart: unless-stopped
    expose:
      - "5000"

  # Self-hosted ears of the court (whisper.cpp), reached by the bot only: text out, no audio kept.
  stt:
    build:
      context: .
      dockerfile: docker/whisper.Dockerfile
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base}
    restart: unless-stopped
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      POSTGRESQL_URL: postgres://tribunal:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/tribunal
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: https://tribunal.gaetanhus.fr
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?}
    depends_on:
      - postgres

volumes:
  postgres-data:
